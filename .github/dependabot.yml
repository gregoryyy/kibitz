version: 2
updates:
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    versioning-strategy: increase
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
