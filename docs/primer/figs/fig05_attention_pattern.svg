<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 405" width="720" height="405" font-family="Helvetica, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Attention pattern</title><desc id="d">An eight by eight grid of illustrative attention weights for the tokens 1. e4 e5 2. Nf3 d6 3. d4. Each row is one token looking back at the tokens before it; cells above the diagonal are masked. The row for d4 is highlighted with its percentages.</desc>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.5 L7,4 L0,7.5" fill="none" stroke="#1E2A30" stroke-width="1.2"/></marker><marker id="arrm" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.5 L7,4 L0,7.5" fill="none" stroke="#5E6E76" stroke-width="1.2"/></marker><marker id="arrr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.5 L7,4 L0,7.5" fill="none" stroke="#F3533A" stroke-width="1.4"/></marker><marker id="arrb" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.5 L7,4 L0,7.5" fill="none" stroke="#004C8C" stroke-width="1.4"/></marker></defs>
<rect width="720" height="405" fill="#FFFFFF"/>
<defs><pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="#EEF2F3"/><line x1="0" y1="0" x2="0" y2="5" stroke="#E3E9EA" stroke-width="2"/></pattern><linearGradient id="scale" x1="0" x2="1"><stop offset="0.00" stop-color="#FDF3F1"/><stop offset="0.25" stop-color="#FBC5BA"/><stop offset="0.50" stop-color="#F8553B"/><stop offset="0.75" stop-color="#C32B17"/><stop offset="1.00" stop-color="#8A1004"/></linearGradient></defs>
