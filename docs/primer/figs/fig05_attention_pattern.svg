<text x="118.0" y="353.0" font-size="7.2" fill="#1E2A30" font-weight="normal" text-anchor="start" font-style="">Head A ≈ same side, same kind: e4 and d4</text>
<rect x="254.0" y="346.0" width="10.0" height="7.0" rx="1.5" fill="#FF9A85" stroke="none" stroke-width="1"/>
<text x="268.0" y="353.0" font-size="7.2" fill="#1E2A30" font-weight="normal" text-anchor="start" font-style="">Head B ≈ opening pattern: Nf3, d6</text>
<rect x="394.0" y="346.0" width="10.0" height="7.0" rx="1.5" fill="#B9321A" stroke="none" stroke-width="1"/>
<text x="408.0" y="353.0" font-size="7.2" fill="#1E2A30" font-weight="normal" text-anchor="start" font-style="">Head C ≈ attacker and target: e5</text>
<text x="104.0" y="367.0" font-size="7" fill="#5E6E76" font-weight="normal" text-anchor="start" font-style="">Head colors mark which head contributes most to each weight of the d4 row.</text>
<circle cx="468" cy="313.5" r="7.5" fill="#1E2A30"/>
<text x="468.0" y="316.5" font-size="8.5" fill="#FFFFFF" font-weight="bold" text-anchor="middle" font-style="">1</text>
<circle cx="368" cy="154" r="7.5" fill="#1E2A30"/>
<text x="368.0" y="157.0" font-size="8.5" fill="#FFFFFF" font-weight="bold" text-anchor="middle" font-style="">2</text>
<circle cx="302.0" cy="197.5" r="7.5" fill="#1E2A30"/>
<text x="302.0" y="200.5" font-size="8.5" fill="#FFFFFF" font-weight="bold" text-anchor="middle" font-style="">3</text>
<line x1="484" y1="84" x2="484" y2="384" stroke="#C9D3D6" stroke-width="0.8"/>
<circle cx="499" cy="88.5" r="6.5" fill="#1E2A30"/>
<text x="499.0" y="91.2" font-size="7.5" fill="#FFFFFF" font-weight="bold" text-anchor="middle" font-style="">1</text>
<text x="511.0" y="92.0" font-size="9" fill="#1E2A30" font-weight="bold" text-anchor="start" font-style="">The d4 row</text>
<text x="511.0" y="104.0" font-size="7.6" fill="#5E6E76" font-weight="normal" text-anchor="start" font-style="">d4 looks back at every earlier token.</text>
<text x="511.0" y="114.2" font-size="7.6" fill="#5E6E76" font-weight="normal" text-anchor="start" font-style="">Its weights add up to 100 %. These are</text>
<text x="511.0" y="124.4" font-size="7.6" fill="#5E6E76" font-weight="normal" text-anchor="start" font-style="">the arcs on the transformer figure.</text>
<circle cx="499" cy="139.1" r="6.5" fill="#1E2A30"/>
<text x="499.0" y="141.8" font-size="7.5" fill="#FFFFFF" font-weight="bold" text-anchor="middle" font-style="">2</text>
<text x="511.0" y="142.6" font-size="9" fill="#1E2A30" font-weight="bold" text-anchor="start" font-style="">No look-ahead</text>
<text x="511.0" y="154.6" font-size="7.6" fill="#5E6E76" font-weight="normal" text-anchor="start" font-style="">Gray cells are masked: a token never</text>
<text x="511.0" y="164.8" font-size="7.6" fill="#5E6E76" font-weight="normal" text-anchor="start" font-style="">sees the tokens that come after it.</text>
<circle cx="499" cy="179.49999999999997" r="6.5" fill="#1E2A30"/>
<text x="499.0" y="182.2" font-size="7.5" fill="#FFFFFF" font-weight="bold" text-anchor="middle" font-style="">3</text>
<text x="511.0" y="183.0" font-size="9" fill="#1E2A30" font-weight="bold" text-anchor="start" font-style="">The diagonal</text>
<text x="511.0" y="195.0" font-size="7.6" fill="#5E6E76" font-weight="normal" text-anchor="start" font-style="">Each token also looks at itself.</text>
<text x="492.0" y="213.2" font-size="9" fill="#1E2A30" font-weight="bold" text-anchor="start" font-style="">Parallel in training</text>
<text x="492.0" y="225.2" font-size="7.6" fill="#5E6E76" font-weight="normal" text-anchor="start" font-style="">All rows are computed at once; every row</text>
<text x="492.0" y="235.4" font-size="7.6" fill="#5E6E76" font-weight="normal" text-anchor="start" font-style="">predicts its own next token.</text>
<text x="492.0" y="253.6" font-size="9" fill="#1E2A30" font-weight="bold" text-anchor="start" font-style="">One row at a time in generation</text>
<text x="492.0" y="265.6" font-size="7.6" fill="#5E6E76" font-weight="normal" text-anchor="start" font-style="">Each new token adds one row. Earlier</text>
<text x="492.0" y="275.8" font-size="7.6" fill="#5E6E76" font-weight="normal" text-anchor="start" font-style="">rows stay fixed in the KV cache.</text>
<text x="492.0" y="294.0" font-size="9" fill="#1E2A30" font-weight="bold" text-anchor="start" font-style="">Cost grows with the square</text>
<text x="492.0" y="306.0" font-size="7.6" fill="#5E6E76" font-weight="normal" text-anchor="start" font-style="">8 tokens → 64 cells;</text>
<text x="492.0" y="316.2" font-size="7.6" fill="#5E6E76" font-weight="normal" text-anchor="start" font-style="">1,000 tokens → a million cells.</text>
<text x="492.0" y="350.0" font-size="7.5" fill="#1E2A30" font-weight="bold" text-anchor="start" font-style="">Attention weight</text>
<rect x="492.0" y="355.0" width="150.0" height="8.0" rx="2" fill="url(#scale)" stroke="none" stroke-width="1"/>
