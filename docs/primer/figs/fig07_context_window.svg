<text x="44.0" y="104.0" font-size="7.4" fill="#5E6E76" font-weight="normal" text-anchor="start" font-style="">system prompt: role and rules</text>
<rect x="36.0" y="115.0" width="256.0" height="18.0" rx="3" fill="#F2F5F6" stroke="none" stroke-width="1"/>
<text x="44.0" y="127.0" font-size="7.4" fill="#5E6E76" font-weight="normal" text-anchor="start" font-style="">facts the application adds</text>
<rect x="36.0" y="138.0" width="256.0" height="18.0" rx="3" fill="#FFF1D6" stroke="none" stroke-width="1"/>
<text x="44.0" y="150.0" font-size="7.4" fill="#1E2A30" font-weight="normal" text-anchor="start" font-style="">1. e4 e5 2. Nf3 d6 3. d4 Bg4 4. dxe5 Bxf3</text>
<rect x="36.0" y="161.0" width="256.0" height="18.0" rx="3" fill="#FFF1D6" stroke="none" stroke-width="1"/>
<text x="44.0" y="173.0" font-size="7.4" fill="#1E2A30" font-weight="normal" text-anchor="start" font-style="">5. Qxf3 dxe5 6. Bc4 Nf6 7. Qb3 Qe7 8. Nc3 c6</text>
<rect x="36.0" y="184.0" width="256.0" height="18.0" rx="3" fill="#FFF1D6" stroke="none" stroke-width="1"/>
<text x="44.0" y="196.0" font-size="7.4" fill="#1E2A30" font-weight="normal" text-anchor="start" font-style="">9. Bg5 b5 10. Nxb5 cxb5 11. Bxb5+ Nbd7 …</text>
<rect x="36.0" y="207.0" width="256.0" height="18.0" rx="3" fill="#F2F5F6" stroke="none" stroke-width="1"/>
<text x="44.0" y="219.0" font-size="7.4" fill="#5E6E76" font-weight="normal" text-anchor="start" font-style="">the question</text>
<text x="36.0" y="242.0" font-size="7" fill="#5E6E76" font-weight="normal" text-anchor="start" font-style="">Everything else is outside: no memory between calls,</text>
<text x="36.0" y="252.0" font-size="7" fill="#5E6E76" font-weight="normal" text-anchor="start" font-style="">no board, no engine, unless the application adds it.</text>
<text x="36.0" y="270.0" font-size="7" fill="#5E6E76" font-weight="normal" text-anchor="start" font-style="italic">Cost: attention grows with the square of the window.</text>
