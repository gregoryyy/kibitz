<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" font-family="Helvetica, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">The context window</title><desc id="d">Left: the context window holding rules, facts, the move list and the question, with earlier material faded. Middle: the board the model never had, drawn with question marks. Right: a curve of how far the model's internal board drifts from the real one as the game goes on.</desc>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.5 L7,4 L0,7.5" fill="none" stroke="#1E2A30" stroke-width="1.2"/></marker><marker id="arrm" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.5 L7,4 L0,7.5" fill="none" stroke="#5E6E76" stroke-width="1.2"/></marker><marker id="arrr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.5 L7,4 L0,7.5" fill="none" stroke="#F3533A" stroke-width="1.4"/></marker><marker id="arrb" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.5 L7,4 L0,7.5" fill="none" stroke="#004C8C" stroke-width="1.4"/></marker></defs>
<rect width="720" height="300" fill="#FFFFFF"/>
<text x="24.0" y="30.0" font-size="16" fill="#1E2A30" font-weight="bold" text-anchor="start" font-style="">The context window</text>
<text x="24.0" y="46.0" font-size="8.5" fill="#5E6E76" font-weight="normal" text-anchor="start" font-style="">What the model can see is the text in the window. The board is never in it.</text>
