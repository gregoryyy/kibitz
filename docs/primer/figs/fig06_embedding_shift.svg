<title>Embedding shift across the transformer layers</title>
<desc>The vector for the token "Amount" starts at its embedding. Each layer adds an attention push (a1, a2, a3, ... a96; the first one shown as the sum of three head contributions) and an MLP push (m1, m2, m3, ... m96). The final vector, "Amount + context", ends at an angle to the embedding: the semantic adjustment.</desc>
