<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" font-family="Helvetica, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Where things run</title><desc id="d">The browser page with the board, Stockfish in Web Workers, chess.js and the symbolic knowledge, and an optional in-browser model; the local server with static files, model weights and the AI gateway that holds the keys; the providers behind the gateway.</desc>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.5 L7,4 L0,7.5" fill="none" stroke="#1E2A30" stroke-width="1.2"/></marker><marker id="arrm" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.5 L7,4 L0,7.5" fill="none" stroke="#5E6E76" stroke-width="1.2"/></marker><marker id="arrr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.5 L7,4 L0,7.5" fill="none" stroke="#F3533A" stroke-width="1.4"/></marker><marker id="arrb" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.5 L7,4 L0,7.5" fill="none" stroke="#004C8C" stroke-width="1.4"/></marker></defs>
<rect width="720" height="330" fill="#FFFFFF"/>
<text x="24.0" y="30.0" font-size="16" fill="#1E2A30" font-weight="bold" text-anchor="start" font-style="">Where things run</text>
<text x="24.0" y="46.0" font-size="8.5" fill="#5E6E76" font-weight="normal" text-anchor="start" font-style="">A single page plus a small local server. Keys stay on the server; the engine runs in the page.</text>
<rect x="24.0" y="62.0" width="500.0" height="86.0" rx="6" fill="#F7F9FA" stroke="#C9D3D6" stroke-width="0.8" stroke-dasharray="3 2"/>
<text x="32.0" y="74.0" font-size="7" fill="#5E6E76" font-weight="normal" text-anchor="start" font-style="italic">Local Node server (site/server)</text>
<rect x="40.0" y="84.0" width="130.0" height="52.0" rx="5" fill="#FFFFFF" stroke="#1E2A30" stroke-width="1"/>
<text x="105.0" y="99.0" font-size="8.2" fill="#1E2A30" font-weight="bold" text-anchor="middle" font-style="">Static files</text>
<text x="105.0" y="111.0" font-size="6.4" fill="#5E6E76" font-weight="normal" text-anchor="middle" font-style="">+ security headers (CSP,</text>
<text x="105.0" y="120.5" font-size="6.4" fill="#5E6E76" font-weight="normal" text-anchor="middle" font-style="">cross-origin isolation)</text>
<rect x="190.0" y="84.0" width="130.0" height="52.0" rx="5" fill="#FFFFFF" stroke="#1E2A30" stroke-width="1"/>
<text x="255.0" y="99.0" font-size="8.2" fill="#1E2A30" font-weight="bold" text-anchor="middle" font-style="">Model weights</text>
<text x="255.0" y="111.0" font-size="6.4" fill="#5E6E76" font-weight="normal" text-anchor="middle" font-style="">site/models</text>
<text x="255.0" y="120.5" font-size="6.4" fill="#5E6E76" font-weight="normal" text-anchor="middle" font-style="">(offline mode only)</text>
<rect x="350.0" y="84.0" width="150.0" height="52.0" rx="5" fill="#FFFFFF" stroke="#F3533A" stroke-width="1"/>
<text x="425.0" y="99.0" font-size="8.2" fill="#F3533A" font-weight="bold" text-anchor="middle" font-style="">AI gateway /api/ai/</text>
<text x="425.0" y="111.0" font-size="6.4" fill="#5E6E76" font-weight="normal" text-anchor="middle" font-style="">keys from .env, limits,</text>
<text x="425.0" y="120.5" font-size="6.4" fill="#5E6E76" font-weight="normal" text-anchor="middle" font-style="">schema validation, NDJSON</text>
<rect x="560.0" y="84.0" width="136.0" height="52.0" rx="5" fill="#FFFFFF" stroke="#F3533A" stroke-width="1"/>
<text x="628.0" y="99.0" font-size="8.2" fill="#F3533A" font-weight="bold" text-anchor="middle" font-style="">Providers</text>
<text x="628.0" y="111.0" font-size="6.4" fill="#5E6E76" font-weight="normal" text-anchor="middle" font-style="">Anthropic (Claude), OpenAI,</text>
<text x="628.0" y="120.5" font-size="6.4" fill="#5E6E76" font-weight="normal" text-anchor="middle" font-style="">Mistral, Ollama</text>
<line x1="500.0" y1="110.0" x2="560.0" y2="110.0" stroke="#F3533A" stroke-width="1.3" marker-end="url(#arrr)"/>
<rect x="24.0" y="164.0" width="500.0" height="150.0" rx="6" fill="#F7F9FA" stroke="#C9D3D6" stroke-width="0.8" stroke-dasharray="3 2"/>
<text x="32.0" y="176.0" font-size="7" fill="#5E6E76" font-weight="normal" text-anchor="start" font-style="italic">Browser page (site/src)</text>
<rect x="40.0" y="192.0" width="150.0" height="52.0" rx="5" fill="#FFFFFF" stroke="#1E2A30" stroke-width="1"/>
<text x="115.0" y="207.0" font-size="8.2" fill="#1E2A30" font-weight="bold" text-anchor="middle" font-style="">Board, dialogue, panels</text>
<text x="115.0" y="219.0" font-size="6.4" fill="#5E6E76" font-weight="normal" text-anchor="middle" font-style="">index.html + ES modules</text>
<text x="115.0" y="228.5" font-size="6.4" fill="#5E6E76" font-weight="normal" text-anchor="middle" font-style="">no framework, no bundler</text>
<rect x="40.0" y="256.0" width="150.0" height="46.0" rx="5" fill="#FFFFFF" stroke="#004C8C" stroke-width="1"/>
<text x="115.0" y="271.0" font-size="8.2" fill="#004C8C" font-weight="bold" text-anchor="middle" font-style="">In-browser model</text>
<text x="115.0" y="283.0" font-size="6.4" fill="#5E6E76" font-weight="normal" text-anchor="middle" font-style="">optional: wllama on</text>
<text x="115.0" y="292.5" font-size="6.4" fill="#5E6E76" font-weight="normal" text-anchor="middle" font-style="">WebGPU / WASM</text>
<line x1="115.0" y1="244.0" x2="115.0" y2="256.0" stroke="#5E6E76" stroke-width="0.8" marker-end="url(#arrm)" stroke-dasharray="2 2"/>
<text x="120.0" y="253.0" font-size="6" fill="#5E6E76" font-weight="normal" text-anchor="start" font-style="">quick or offline</text>
<rect x="230.0" y="186.0" width="130.0" height="46.0" rx="5" fill="#FFFFFF" stroke="#F3533A" stroke-width="1"/>
<text x="295.0" y="201.0" font-size="8.2" fill="#F3533A" font-weight="bold" text-anchor="middle" font-style="">Stockfish 19 (WASM)</text>
<text x="295.0" y="213.0" font-size="6.4" fill="#5E6E76" font-weight="normal" text-anchor="middle" font-style="">analyst + opponent</text>
<text x="295.0" y="222.5" font-size="6.4" fill="#5E6E76" font-weight="normal" text-anchor="middle" font-style="">Web Workers</text>
<rect x="230.0" y="242.0" width="130.0" height="46.0" rx="5" fill="#FFFFFF" stroke="#F3533A" stroke-width="1"/>
<text x="295.0" y="257.0" font-size="8.2" fill="#F3533A" font-weight="bold" text-anchor="middle" font-style="">Symbolic knowledge</text>
<text x="295.0" y="269.0" font-size="6.4" fill="#5E6E76" font-weight="normal" text-anchor="middle" font-style="">chess.js, knowledge.js,</text>
<text x="295.0" y="278.5" font-size="6.4" fill="#5E6E76" font-weight="normal" text-anchor="middle" font-style="">tutor.js, play.js</text>
<rect x="390.0" y="214.0" width="120.0" height="46.0" rx="5" fill="#FFFFFF" stroke="#F3533A" stroke-width="1"/>
<text x="450.0" y="229.0" font-size="8.2" fill="#F3533A" font-weight="bold" text-anchor="middle" font-style="">Checker</text>
<text x="450.0" y="241.0" font-size="6.4" fill="#5E6E76" font-weight="normal" text-anchor="middle" font-style="">checkAnswer() in tutor.js</text>
<text x="450.0" y="250.5" font-size="6.4" fill="#5E6E76" font-weight="normal" text-anchor="middle" font-style="">marks every move</text>
<line x1="190.0" y1="212.0" x2="230.0" y2="206.0" stroke="#1E2A30" stroke-width="1" marker-end="url(#arr)"/>
<line x1="190.0" y1="226.0" x2="230.0" y2="262.0" stroke="#1E2A30" stroke-width="1" marker-end="url(#arr)"/>
<line x1="360.0" y1="262.0" x2="390.0" y2="246.0" stroke="#1E2A30" stroke-width="1" marker-end="url(#arr)"/>
<line x1="150.0" y1="192.0" x2="400.0" y2="136.0" stroke="#004C8C" stroke-width="1.3" marker-end="url(#arrb)"/>
<text x="262.0" y="156.0" font-size="6.4" fill="#004C8C" font-weight="normal" text-anchor="start" font-style="">facts + question</text>
<path d="M105,164 C105,150 105,150 105,136" fill="none" stroke="#5E6E76" stroke-width="0.8" marker-end="url(#arrm)" stroke-dasharray="2 2"/>
<text x="110.0" y="152.0" font-size="6" fill="#5E6E76" font-weight="normal" text-anchor="start" font-style="">serves the page</text>
<text x="24.0" y="326.0" font-size="6.6" fill="#5E6E76" font-weight="normal" text-anchor="start" font-style="">Other deployments of the same page: as a Claude artifact (host model instead of the gateway), or fully offline (in-browser model, nothing leaves the machine).</text>
</svg>