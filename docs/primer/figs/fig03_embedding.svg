<text x="24.0" y="46.0" font-size="8.5" fill="#5E6E76" font-weight="normal" text-anchor="start" font-style="">Tokens used in similar ways end up close together. Two of 12,288 dimensions, illustrative. Words on the left, moves on the right.</text>
